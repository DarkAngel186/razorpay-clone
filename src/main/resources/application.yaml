spring:
  application:
    name: razorpay-clone
  server:
    port: 8080
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpay-clone-db}
    username: ${DB_USER:postgres}
    password: ${DB_PWD:Lokesh@123}
  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false

    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "com.lp.razorpay_clone.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

vault:
  master-key: wJ3k9kFh2s9d8s7d8s9d8s7d8s9d8s7d8s9d8s7d8s9d8s7d8s==

payment:
  simulator:
    poll-interval: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

jwt:
  secret-key: wJ3k9kFh2s9d8s7d8s9d8s7d8sksldjsdwj2wskmspswofnendjisq

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2

  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refund.events
      settlement: settlement.events

  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100